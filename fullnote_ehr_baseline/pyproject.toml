[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fullnote-ehr-baseline"
version = "0.1.0"
description = "Fresh data-contract and structured-EHR pipeline for FullNote + EHR mortality experiments."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "joblib>=1.2,<2",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyarrow>=11,<30",
  "scikit-learn>=1.2,<2",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
modeling = [
  "safetensors>=0.4,<1",
  "torch>=2.1,<3",
  "transformers>=4.35,<6",
  "xgboost>=2.0,<4",
]
dev = [
  "pytest>=7,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
